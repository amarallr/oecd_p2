name: Publicar página explicativa
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', 'scripts/verificar-projeto.cjs', 'scripts/testar-navegador.cjs', 'scripts/verificar-apresentacao.cjs', 'tests/site.test.cjs', '.node-version']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node scripts/verificar-projeto.cjs --web
      - run: node tests/site.test.cjs
      - name: Iniciar servidor e Chromium para validação antes da publicação
        run: |
          node scripts/servir-site.cjs > "$RUNNER_TEMP/p2-server.log" 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9224 --user-data-dir="$RUNNER_TEMP/p2-chrome" --no-first-run --disable-background-networking about:blank > "$RUNNER_TEMP/p2-chrome.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9224/json > /dev/null && curl --silent --fail http://127.0.0.1:8000/oecd_p2/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/p2-chrome.log"
          exit 1
      - name: Validar navegação e responsividade em navegador real
        run: node scripts/testar-navegador.cjs
      - name: Validar apresentação antes da publicação
        env:
          P2_TEST_URL: http://127.0.0.1:8000/oecd_p2/apresentacao.html
        run: node scripts/testar-navegador.cjs
      - name: Preservar evidências de navegador
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencias-f0-web
          path: |
            docs/evidencias/
            tmp/apresentacao-qa/
          retention-days: 30
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Empacotar somente arquivos públicos
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
